events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # ----- HTTP (Port 80) 設定 -----
    server {
        listen 80;
        server_name _;

        # 【新增】專門應付 Loader.io 驗證的攔截規則
        location = /loaderio-0a3d2a9fc3dad1905c768a9f1c03380b.txt {
            default_type text/plain;
            return 200 "loaderio-0a3d2a9fc3dad1905c768a9f1c03380b";
        }

        location /static/ {
            alias /usr/share/nginx/html/static/;
        }

        location / {
            proxy_pass http://app:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # ----- HTTPS (Port 443) 設定 -----
    server {
        listen 443 ssl;
        server_name board.dcdwayne.com;

        # 指定憑證與私鑰的檔案路徑 (對應到容器內部的路徑)
        ssl_certificate /etc/nginx/ssl/fullchain.crt;
        ssl_certificate_key /etc/nginx/ssl/private.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # 加入 static 的路由，確保 HTTPS 也能抓到靜態檔案
        location /static/ {
            alias /usr/share/nginx/html/static/;
        }

        # 轉發給後端的 FastAPI (跟 80 port 保持一致，使用 app:8000)
        location / {
            proxy_pass http://app:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}